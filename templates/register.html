<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register · {{ title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" />
  </head>
  <body class="authbg">
    <div class="authcard">
      <a class="authback" href="{{ url_for('landing') }}">&larr; Back</a>
      <div class="authcard__brand">AI Based Stress Recognition Using HRV and DNN</div>
      <h1 class="authcard__title">Create Account</h1>
      <p class="authcard__subtitle">Sign up to start tracking your HRV-based stress levels</p>

      {% if error %}
        <div class="autherror">{{ error }}</div>
      {% endif %}

      <form method="post" action="{{ url_for('register_submit') }}">
        <div class="authfield">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your full name" value="{{ form.name if form else '' }}" required />
        </div>

        <div class="authfield">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" value="{{ form.email if form else '' }}" required />
        </div>

        <div class="authfield-row">
          <div class="authfield">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="At least 6 characters" required />
          </div>
          <div class="authfield">
            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter password" required />
          </div>
        </div>

        <div class="authfield">
          <label for="age">Age</label>
          <input type="number" id="age" name="age" min="1" max="120" placeholder="Your age" value="{{ form.age if form else '' }}" required />
        </div>

        <button type="submit" class="authbtn">Create Account</button>
      </form>

      <div class="authswitch">
        Already have an account? <a href="{{ url_for('login_page') }}">Sign in</a>
      </div>
    </div>
  </body>
</html>
